<!doctype html>
<meta charset="utf-8">
<title>Mock YouTube player</title>
<!-- The markup content/youtube.js relies on. Live YouTube doesn't render captions headlessly. -->
<style>
  body { margin: 20px; background: #111; }
  .html5-video-player { position: relative; width: 800px; height: 450px; background: #000; }
  video { width: 100%; height: 100%; }
  .caption-window { position: absolute; left: 150px; bottom: 40px; width: 500px; text-align: center; }
  .ytp-caption-segment { background: rgba(8, 8, 8, .75); color: #fff; font: 28px sans-serif; }
</style>
<div class="html5-video-player" id="player">
  <video id="video" muted playsinline></video>
  <div class="caption-window"><span class="ytp-caption-segment" id="caption">the <span id="caption-word">mysterious</span> old harbor</span></div>
</div>
<canvas id="source" width="16" height="9" hidden></canvas>
<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('source');
  let playCount = 0;
  video.addEventListener('play', () => playCount++);
  document.getElementById('player').addEventListener('click', () => { window.playerClicks = (window.playerClicks || 0) + 1; });
  // A live stream from a canvas needs no media file.
  const context = canvas.getContext('2d');
  let tick = 0;
  setInterval(() => { context.fillStyle = tick++ % 2 ? '#333' : '#555'; context.fillRect(0, 0, 16, 9); }, 100);
  video.srcObject = canvas.captureStream(10);
  video.play().catch(() => {});
  function locate(id) {
    const r = document.getElementById(id).getBoundingClientRect();
    return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2) };
  }
</script>
